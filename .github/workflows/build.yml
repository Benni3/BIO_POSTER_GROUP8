
name: Build LaTeX Website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile LaTeX to HTML and SVG
        uses: xu-cheng/texlive-action@v3
        with:
          texlive_version: 2026
          run: |
            mkdir -p site

            make4ht \
              -u \
              -f html5 \
              -d site \
              main.tex \
              "mathjax"

            test -s site/main.html

      - name: Copy website files
        run: |
          cp index.html site/index.html

          # Make all required assets available
          # in the published directory.
          test -s site/main.html

          echo "Generated website files:"
          find site -maxdepth 2 -type f

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
