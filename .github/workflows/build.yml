
name: Build LaTeX Website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate HTML and SVG from LaTeX
        uses: xu-cheng/texlive-action@v3
        with:
          texlive_version: 2026
          run: |
            mkdir -p site

            make4ht \
              -u \
              -f html5 \
              -d site \
              main.tex \
              "mathjax"

            # Copy homepage in the same container
            cp index.html site/index.html

            # Verify generated files
            test -s site/main.html
            test -s site/index.html

            echo "Website files:"
            find site -maxdepth 2 -type f

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload generated website
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
