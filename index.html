<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Document</title>

  <style>
    :root {
      color-scheme: light;
      --DTUblue: #103455;
      --DTUaccent: #56A9D3;
      --DTUlight: #EEF5F9;
      --DTUborder: #C5D9E5;

      box-sizing: border-box;
    }

      color: var(--DTUink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

    }

    .site-header {
      padding: 2rem 1.25rem 1.75rem;

</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <h1>Document</h1>
      <p>Rendered from <code>main.tex</code></p>
    </div>
  </header>

  <main class="page-content">
    <p id="status" class="status" role="status">Loading document…</p>
    <div id="message" class="message-card" role="alert" hidden></div>
    <article id="document-content" class="document-card"></article>
  </main>

  <script>
    (() => {
      const status = document.getElementById("status");
      const message = document.getElementById("message");
      const content = document.getElementById("document-content");

      function showError(text) {
        status.hidden = true;
        message.textContent = text;
        message.hidden = false;
      }

      function prepareLatex(source) {
        const documentStart = /\\begin\s*\{\s*document\s*\}/m.exec(source);
        let body = documentStart
          ? source.slice(documentStart.index + documentStart[0].length)
          : source;

        body = body
          .replace(/\\end\s*\{\s*document\s*\}/g, "")
          .replace(/\\maketitle\b/g, "")
          .replace(/\\documentclass\s*(?:\[[^\]]*\]\s*)?\{[^{}]*\}/g, "")
          .replace(/\\usepackage\s*(?:\[[^\]]*\]\s*)?\{[^{}]*\}/g, "")
          .replace(/\\definecolor\s*\{[^{}]*\}\s*\{[^{}]*\}\s*\{[^{}]*\}/g, "");

        return "\\documentclass{article}\n\\begin{document}\n" +
          body +
          "\n\\end{document}";
      }

      async function renderDocument() {
        if (window.location.protocol === "file:") {
          showError(
            "This page cannot fetch main.tex when opened directly as a file on macOS. " +
            "Commit index.html and main.tex to the same folder and open the page through GitHub Pages."
          );
          return;
        }

        if (!window.latexjs || typeof window.latexjs.parse !== "function") {
          showError(
            "The LaTeX rendering library could not be loaded. Check your internet connection and reload the page."
          );
          return;
        }

        try {
          const response = await fetch("./main.tex");
          if (!response.ok) {
            throw new Error(
              "Could not load main.tex (HTTP " + response.status + "). " +
              "Check that it is in the same folder as index.html and that its filename uses the exact lowercase spelling."
            );
          }

          const source = await response.text();
          const generator = new window.latexjs.HtmlGenerator({ hyphenate: false });

          window.latexjs.parse(prepareLatex(source), { generator });

          const resources = generator.stylesAndScripts(
            "https://cdn.jsdelivr.net/npm/latex.js@0.12.6/dist/"
          );
          if (resources) {
            document.head.appendChild(resources);
          }

          content.replaceChildren(generator.domFragment());
          status.hidden = true;
        } catch (error) {
          showError(
            "The document could not be loaded or rendered. " +
            (error && error.message ? error.message : "Check main.tex and reload the page.")
          );
        }
      }

      renderDocument();
    })();
  </script>
</body>
</html>
