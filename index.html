
<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <meta name="theme-color" content="#103455">

  <title>
    Alzheimer's Prediction | Quantitative Analysis
  </title>

  <style>
    :root {
      --DTUblue: #103455;
      --DTUaccent: #56A9D3;
      --DTUlight: #EEF5F9;
      --DTUborder: #C5D9E5;
      --DTUink: #183147;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--DTUlight);
      color: var(--DTUink);
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      line-height: 1.65;
    }

    /* HEADER */

    .site-header {
      background: var(--DTUblue);
      border-bottom: 5px solid var(--DTUaccent);
      color: white;
      padding: 2rem 1.5rem;
    }

    .header-inner,
    .page-content {
      width: min(100% - 2rem, 950px);
      margin-inline: auto;
    }

    .eyebrow {
      color: #aed7ed;
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .site-header h1 {
      margin: 0.5rem 0;
      font-size: clamp(1.6rem, 4vw, 2.5rem);
      line-height: 1.2;
    }

    .subtitle {
      color: #e0edf5;
      margin: 0;
    }

    /* DOCUMENT */

    .page-content {
      padding-block: 2rem;
    }

    .document-card {
      background: white;
      padding: clamp(1rem, 4vw, 2.5rem);
      border: 1px solid var(--DTUborder);
      border-radius: 10px;
      box-shadow: 0 4px 18px rgb(16 52 85 / 6%);
      overflow-wrap: anywhere;
    }

    /* LATEX CONTENT */

    #document-content {
      color: var(--DTUink);
      font-size: 1rem;
      line-height: 1.7;
    }

    #document-content h1,
    #document-content h2,
    #document-content h3,
    #document-content h4 {
      color: var(--DTUblue);
      line-height: 1.3;
      margin-top: 1.6em;
      margin-bottom: 0.6em;
    }

    #document-content h2 {
      padding-bottom: 0.3rem;
      border-bottom: 2px solid var(--DTUaccent);
    }

    #document-content p {
      margin-block: 0.8rem;
    }

    /* VECTOR FIGURES */

    #document-content img,
    #document-content svg,
    #document-content object {
      display: block;
      max-width: 100%;
      height: auto;
      margin-inline: auto;
    }

    #document-content .figure {
      margin: 2rem auto;
      text-align: center;
      max-width: 100%;
    }

    #document-content .figure img {
      width: auto;
      max-width: 100%;
    }

    #document-content .caption {
      color: #526b7e;
      font-size: 0.9rem;
      margin-top: 0.7rem;
      text-align: center;
    }

    /* TABLES */

    #document-content table {
      max-width: 100%;
      margin: 1rem auto;
      border-collapse: collapse;
    }

    #document-content th,
    #document-content td {
      padding: 0.55rem 0.75rem;
      border-bottom: 1px solid var(--DTUborder);
    }

    #document-content th {
      background: var(--DTUlight);
      color: var(--DTUblue);
      font-weight: 700;
    }

    /* EQUATIONS */

    #document-content mjx-container[display="true"] {
      overflow-x: auto;
      overflow-y: hidden;
      padding-block: 0.5rem;
      max-width: 100%;
    }

    #document-content .math {
      max-width: 100%;
    }

    /* MESSAGES */

    .status {
      color: #536b7b;
      padding: 1rem;
    }

    .error {
      background: #fff0ed;
      color: #963b2f;
      border: 1px solid #e6b8b1;
      border-radius: 6px;
      padding: 1rem;
    }

    .error[hidden] {
      display: none;
    }

    /* FOOTER */

    footer {
      text-align: center;
      padding: 2rem;
      font-size: 0.85rem;
      color: #647b8c;
    }

    @media (max-width: 600px) {
      .site-header {
        padding: 1.5rem 1rem;
      }

      .page-content {
        width: calc(100% - 1rem);
        padding-block: 1rem;
      }

      .document-card {
        padding: 1rem;
      }

      #document-content {
        font-size: 0.95rem;
      }
    }
  </style>
</head>

<body>

  <header class="site-header">
    <div class="header-inner">

      <div class="eyebrow">
        Technical University of Denmark |
        Bioengineering 27020 | NEURO 8
      </div>

      <h1>
        Supplementary Quantitative Analysis
      </h1>

      <p class="subtitle">
        Early & Personalized Alzheimer's Prediction
      </p>

    </div>
  </header>

  <main class="page-content">

    <article class="document-card">

      <p id="status" class="status" role="status">
        Loading LaTeX document...
      </p>

      <div id="message"
           class="error"
           role="alert"
           hidden>
      </div>

      <div id="document-content"></div>

    </article>

  </main>

  <footer>
    DTU Bioengineering 27020 |
    NEURO Group 8 |
    2026
  </footer>

  <script>
    (() => {
      const content =
        document.getElementById("document-content");

      const status =
        document.getElementById("status");

      const message =
        document.getElementById("message");

      function showError(text) {
        status.hidden = true;
        message.textContent = text;
        message.hidden = false;
      }

      /*
       * Load styles generated by TeX4ht.
       * These supplement the DTU website styling.
       */
      function loadDocumentStyles(parsedDocument) {
        const styles =
          parsedDocument.head.querySelectorAll(
            'link[rel="stylesheet"], style'
          );

        for (const element of styles) {
          document.head.appendChild(
            document.importNode(element, true)
          );
        }
      }

      /*
       * Load MathJax after the HTML is inserted.
       * MathJax renders both TeX and MathML output.
       */
      function renderMathematics() {
        return new Promise((resolve, reject) => {
          window.MathJax = {
            tex: {
              inlineMath: [
                ["\\(", "\\)"],
                ["$", "$"]
              ],
              displayMath: [
                ["\\[", "\\]"],
                ["$$", "$$"]
              ]
            },
            options: {
              enableMenu: false
            },
            startup: {
              ready: () => {
                MathJax.startup.defaultReady();
                MathJax.startup.promise
                  .then(resolve)
                  .catch(reject);
              }
            }
          };

          const script =
            document.createElement("script");

          script.src =
            "https://cdn.jsdelivr.net/npm/" +
            "mathjax@3/es5/tex-mml-chtml.js";

          script.async = true;
          script.onerror = () =>
            reject(new Error(
              "MathJax could not be loaded."
            ));

          document.head.appendChild(script);
        });
      }

      /*
       * Read HTML generated automatically
       * from main.tex by GitHub Actions.
       */
      async function loadLatexDocument() {
        try {
          if (location.protocol === "file:") {
            throw new Error(
              "Open this page through GitHub Pages " +
              "or a local web server."
            );
          }

          const response = await fetch("./main.html", {
            cache: "no-store"
          });

          if (!response.ok) {
            throw new Error(
              "Generated main.html not found. " +
              "HTTP " + response.status
            );
          }

          const html = await response.text();

          const parser = new DOMParser();

          const parsed = parser.parseFromString(
            html,
            "text/html"
          );

          loadDocumentStyles(parsed);

          /*
           * Insert actual generated HTML:
           * - paragraphs
           * - section headings
           * - HTML tables
           * - SVG figures
           * - mathematical expressions
           */
          const fragment =
            document.createDocumentFragment();

          for (const node of parsed.body.childNodes) {
            fragment.appendChild(
              document.importNode(node, true)
            );
          }

          content.replaceChildren(fragment);

          status.textContent =
            "Rendering mathematical equations...";

          await renderMathematics();

          status.hidden = true;

        } catch (error) {
          showError(
            "Unable to display the LaTeX document. " +
            error.message
          );
        }
      }

      loadLatexDocument();
    })();
  </script>

</body>
</html>
